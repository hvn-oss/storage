name: CI

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: "lts"
          cache: true
          run-install: true
      - run: vp run check
      - run: vp run test
      - run: vp run build
